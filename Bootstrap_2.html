<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    </title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    
    
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>
    <style>
        .container{
            color: blue;
        }
        .page-link{
            background-color: cornsilk;
        }
        .Pagination2{ .page-link{
             background-color: rgb(31, 11, 142);
            }
            .container{
                color: antiquewhite;
            }
           
        }
       
    </style>
</head>
<body>
   <h1>Pagination</h1>
    <div class="container">
        <ul class="pagination">
            <ul class="pagination">
                <li class="page-item">
                    <a class="page-link">
                        Prev
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link">
                        1
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link">
                        2
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link">
                        Next
                    </a>
                </li>
                
               
        </ul>
    </div>
    <h1>Pagination2</h1>
    <div class="Pagination2">
        <div class="container">
        <ul class="pagination">
            <ul class="pagination">
                <li class="page-item">
                    <a class="page-link">
                        <<< </a>
                </li>
                <li class="page-item">
                    <a class="page-link">
                        1
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link">
                        2
                    </a>
                </li>
                <li class="page-item">
                    <a class="page-link">
                        >>>
                    </a>
                </li>
    
    
            </ul>
        </div>
    </div>
   
</body>
</html>
